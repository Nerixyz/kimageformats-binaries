name: Build KImageFormats
on:
  push:
    branches: [master, nerix-adjustments]
  workflow_dispatch:
  pull_request:
    branches: [master, nerix-adjustments]

env:
  VCPKG_BINARY_SOURCES: "clear;default,readwrite"

concurrency:
  group: kimageformats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Added in nerix-adjustments
          # don't need the other ones right now
          - os: macos-14
            vers: "6.9.3"
            buildArch: "Universal"
          - os: macos-26
            vers: "6.12.0"
            buildArch: "Universal"

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          cache: true
          version: ${{ matrix.vers }}
          arch: ${{ matrix.arch }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      # Download and build vcpkg, without installing any port. If content is cached already, it is a no-op.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "3b156cbdecf72d1032e8e1c80d2de97a0c40a285"

      - name: Build KImageFormats (just one big step for now)
        run: pwsh pwsh/buildkimageformats.ps1
        env:
          buildArch: ${{ matrix.buildArch }}

      - name: "Upload Artifact"
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: kimageformats-${{ matrix.os }}-${{ matrix.vers }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: kimageformats/output

      - name: "Zip Artifact"
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: "zip"
          path: kimageformats/output/
          filename: "kimageformats-${{ matrix.os }}-${{ matrix.vers }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}.zip"

      - name: "Upload to continous release"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "cont"
          files: kimageformats-*.zip
